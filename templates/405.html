{% load static %}
<style>
  @import url('https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap');
  * { margin: 0; padding: 0; font-family: "Poppins", sans-serif; }
  body { background-color: #ffffff !important; min-height: 100vh; }
  .hr-error_container { display: flex; justify-content: center; align-items: center; min-height: 100vh; flex-direction: column; gap: 1rem; text-align: center; padding: 2rem; }
  .hr-405 { font-size: 5rem; line-height: 1.2; color: #f59e0b; }
  .hr-error_msg { font-weight: bold; font-size: 1.5rem; color: #374151; }
  .hr-error_btn { background-color: #3b82f6; color: #fff; border-radius: 35px; padding: 0.5rem 2rem; text-decoration: none; display: inline-flex; align-items: center; font-size: 1rem; }
  .hr-error_btn:hover { color: #fff; background-color: #2563eb; }
</style>
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>405 - Method Not Allowed</title>
  <link rel="icon" type="image/png" sizes="32x32" href="{% static 'favicons/favicon-32x32.png' %}">
</head>
<body>
  <section class="hr-error_container">
    <h1 class="hr-405">405</h1>
    <p class="hr-error_msg">Method not allowed</p>
    <p>This request method is not supported for this URL.</p>
    <a href="/" class="hr-error_btn"><ion-icon name="arrow-back-outline"></ion-icon> Return to main page</a>
  </section>
  <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
  <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
</body>
</html>
